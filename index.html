
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Friendly Node</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    width:100%; height:100%; background:#000; overflow:hidden;
    font-family: 'Courier New', monospace;
    color:#0f0;
  }
  #stage {
    position:fixed; inset:0; background:#000;
    display:flex; align-items:center; justify-content:center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  canvas#matrix { position:absolute; inset:0; width:100%; height:100%; display:block; opacity:0.45; z-index:2; }

  #stage::before {
    content:""; position:absolute; inset:0; pointer-events:none; z-index:45;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  /* ---------- START SCREEN ---------- */
  #startScreen {
    position:relative; width:92%; max-width:420px; z-index:20;
    padding:28px 22px; border-radius:12px;
    border:1.5px solid #00ff88;
    background: rgba(0, 15, 8, 0.88);
    box-shadow: 0 0 25px rgba(0, 255, 136, 0.25);
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:16px;
  }
  #startScreen h1 {
    font-size:1.3rem; color:#00ff88; text-shadow:0 0 10px rgba(0,255,136,0.5);
  }
  #startScreen p {
    font-size:0.92rem; color:#d8ffe8; line-height:1.5;
  }

  /* ---------- 10 FRIENDLY COLOR PAGES ---------- */
  #friendlyPage {
    --theme: #00ff88;
    --tint: rgba(0, 255, 136, 0.14);
    position:relative; width:92%; max-width:430px; z-index:15;
    display:none; flex-direction:column; align-items:center; text-align:center; gap:16px;
    padding:26px 20px; border-radius:12px;
    border:1.5px solid var(--theme);
    background:
      radial-gradient(circle at 50% 25%, var(--tint) 0%, rgba(0, 0, 0, 0.9) 72%),
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 100% 100%, 22px 22px, 22px 22px;
    box-shadow: 0 0 26px color-mix(in srgb, var(--theme) 32%, transparent);
    animation: pagePop 0.25s ease-out;
  }
  #friendlyPage.show { display:flex; }

  @keyframes pagePop {
    from { opacity:0; transform: scale(0.96) translateY(6px); }
    to { opacity:1; transform: scale(1) translateY(0); }
  }

  .badge {
    font-size:0.78rem; letter-spacing:1.5px; padding:5px 12px; border-radius:999px;
    border:1px solid var(--theme); color:var(--theme); background:rgba(0,0,0,0.75);
  }
  .friendlyTitle {
    font-size:1.3rem; font-weight:bold; color:var(--theme);
    text-shadow:0 0 10px color-mix(in srgb, var(--theme) 55%, transparent);
  }
  .friendlyMsg {
    font-size:0.95rem; color:#eefcf3; line-height:1.55; max-width:340px;
  }

  .miniBarWrap {
    width:100%; height:10px; border-radius:999px; overflow:hidden;
    border:1px solid var(--theme); background:rgba(0,0,0,0.75);
  }
  .miniBarFill {
    height:100%; width:0%; background:var(--theme);
    box-shadow:0 0 10px var(--theme);
  }
  .timerLabel {
    font-size:0.82rem; color:var(--theme); letter-spacing:1px;
  }

  .actionBtn {
    background:rgba(0, 0, 0, 0.72);
    border:2px solid var(--theme, #00ff88);
    color:var(--theme, #00ff88);
    padding:14px 30px; font-family:inherit; font-size:1rem; font-weight:bold;
    letter-spacing:1.5px; border-radius:8px; cursor:pointer;
    box-shadow:0 0 16px color-mix(in srgb, var(--theme, #00ff88) 35%, transparent);
    transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease;
  }
  .actionBtn:active {
    transform:scale(0.96);
    background:var(--theme, #00ff88);
    color:#000;
  }

  /* ---------- 11TH STEP: ORIGINAL PRANK SCREEN + SIDE TECH HUD ---------- */
  #prank {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:flex-start;
    z-index:25; padding-top: max(24px, env(safe-area-inset-top));
    overflow:hidden;
  }

  canvas#hudSideCanvas {
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:26; opacity:0.96;
  }

  #picWrap, #log, #barOuter, #pct {
    position:relative; z-index:28;
  }

  #picWrap {
    position:relative; width:44vw; max-width:210px; aspect-ratio:1/1;
    border-radius:10px; overflow:hidden; margin-top:4.5vh;
    box-shadow: 0 0 0 3px #0f0, 0 0 25px 4px #0f0;
    opacity:0; transform: scale(0.7);
  }
  #picWrap.show {
    animation: popIn .35s ease-out forwards, glitchShake .12s steps(2) infinite;
  }
  #picWrap img {
    width:100%; height:100%; object-fit:cover; display:block;
    filter: grayscale(1) brightness(0.9) contrast(1.3) sepia(1) hue-rotate(60deg) saturate(4);
    mix-blend-mode: normal;
  }
  #picWrap::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 2px,
      transparent 2px, transparent 4px
    );
    mix-blend-mode: overlay;
  }

  @keyframes popIn {
    0% { opacity:0; transform:scale(0.6); }
    60% { opacity:1; transform:scale(1.05); }
    100% { opacity:1; transform:scale(1); }
  }
  @keyframes glitchShake {
    0% { transform: translate(0,0); }
    50% { transform: translate(1px,-1px); }
    100% { transform: translate(-1px,1px); }
  }

  #log {
    margin-top:3vh; width:88%; max-width:440px; font-size:0.88rem;
    line-height:1.55; text-shadow:0 0 6px #0f0;
    background: rgba(0, 8, 3, 0.72);
    padding: 8px 12px; border-radius: 6px;
    border: 1px solid rgba(0, 255, 85, 0.45);
  }
  #log div { opacity:0; white-space:pre-wrap; }
  #log div.on { opacity:1; }
  #log .bad { color:#ff3b3b; text-shadow:0 0 6px #ff3b3b; }

  #barOuter {
    margin-top:2vh; width:88%; max-width:440px; height:16px;
    border:1.5px solid #00ff66; border-radius:3px; overflow:hidden;
    background: rgba(0, 10, 4, 0.85);
  }
  #barInner { height:100%; width:0%; background:#00ff66; box-shadow:0 0 12px #00ff66; }

  #pct { margin-top:8px; font-size:0.85rem; letter-spacing:1px; font-weight:bold; }

  .flash { animation: flashbang 0.35s steps(3) forwards; }
  @keyframes flashbang {
    0% { filter: invert(0); }
    30% { filter: invert(1) hue-rotate(180deg); }
    60% { filter: invert(0.3); }
    100% { filter: invert(0); }
  }

  /* ---------- THANKS BUDDY HACKER SCREEN ---------- */
  #thanksHackerScreen {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:
      radial-gradient(circle at 50% 40%, rgba(0, 255, 70, 0.16) 0%, rgba(0, 0, 0, 0.92) 72%),
      linear-gradient(rgba(0, 255, 0, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 0, 0.08) 1px, transparent 1px);
    background-size: 100% 100%, 24px 24px, 24px 24px;
    color:#0f0; padding:8vw; gap:16px; z-index:40;
  }
  #thanksHackerScreen.show {
    display:flex;
    animation: fadeIn .35s ease-out, hackerPulse 1.4s ease-in-out infinite;
  }
  @keyframes hackerPulse {
    0%, 100% { box-shadow: inset 0 0 70px rgba(0, 255, 0, 0.25); }
    50% { box-shadow: inset 0 0 150px rgba(0, 255, 0, 0.55); }
  }
  #thanksHackerScreen .emoji {
    font-size:3.4rem;
    animation: glitchShake .15s steps(2) infinite;
  }
  @keyframes glitchShake {
    0% { transform: translate(0,0); }
    50% { transform: translate(2px,-1px); }
    100% { transform: translate(-2px,1px); }
  }
  #thanksHackerScreen h2 {
    font-size:1.45rem; color:#ff3b3b;
    text-shadow:0 0 12px #ff3b3b, 0 0 4px #0f0; letter-spacing:1px;
  }
  #thanksHackerScreen p {
    font-size:1rem; color:#9effa0; max-width:340px; line-height:1.5;
    text-shadow:0 0 8px rgba(0,255,0,0.6);
  }

  /* ---------- FINAL BLACK SCREEN ---------- */
  #finalBlack {
    position:absolute; inset:0; background:#000; display:none; z-index:55;
  }
  #finalBlack.show { display:block; animation: fadeIn .5s ease-out; }

  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
</style>
</head>
<body>
<div id="stage">
  <audio id="gotchaSound" src="Glitchinng.aac" preload="auto"></audio>
  <audio id="revealSound" src="Gotcha.aac" preload="auto"></audio>

  <canvas id="matrix"></canvas>

  <!-- Start Screen -->
  <div id="startScreen">
    <h1>👋 Hey Friend!</h1>
    <p>Tap the button below to start a smooth 10-step friendly visit.</p>
    <button id="startBtn" class="actionBtn" style="--theme:#00ff88; --tint:rgba(0,255,136,0.14);">PRESS TO START</button>
  </div>

  <!-- 10 Auto-Advancing Friendly Pages (5s each, different colors, no sound) -->
  <div id="friendlyPage">
    <div id="pageBadge" class="badge">PAGE 1 / 10</div>
    <h2 id="pageTitle" class="friendlyTitle">Warm Welcome</h2>
    <p id="pageMsg" class="friendlyMsg">Glad you stopped by! Relax and enjoy the view.</p>
    <div class="miniBarWrap">
      <div id="pageBar" class="miniBarFill"></div>
    </div>
    <div id="pageTimer" class="timerLabel">5s</div>
  </div>

  <!-- 11th Step: Original Prank Screen + Side HUD Telemetry -->
  <div id="prank">
    <canvas id="hudSideCanvas"></canvas>
    <div id="picWrap"><img src="photo.jpg" alt=""></div>
    <div id="log"></div>
    <div id="barOuter"><div id="barInner"></div></div>
    <div id="pct">0%</div>
  </div>

  <!-- Thanks Buddy Hacker Screen -->
  <div id="thanksHackerScreen">
    <div class="emoji">🥷 💀</div>
    <h2>💀 Thanks Buddy for access.</h2>
    <p>Welcome to RpJword ,The depth of black trick.</p>
  </div>

  <!-- Final Black Screen -->
  <div id="finalBlack"></div>
</div>

<script>
(function(){
  const BACK_LOCK_MS = 90000000;
  const BACK_GUARD_DEPTH = 200000; // Hold across back steps
  const STEP_DURATION_MS = 1000; // Step interval

  let lockExpiresAt = Date.now() + BACK_LOCK_MS;
  let currentIndex = 0;
  let onEleventhPage = false;
  let stepInterval = null;
  let stepTimeout = null;
  let hudAnimId = null;
  let prankProgressValue = 0;

  let audioCtx = null;
  const reversedBufferCache = {};

  const stage = document.getElementById('stage');
  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');
  const friendlyPage = document.getElementById('friendlyPage');
  const pageBadge = document.getElementById('pageBadge');
  const pageTitle = document.getElementById('pageTitle');
  const pageMsg = document.getElementById('pageMsg');
  const pageBar = document.getElementById('pageBar');
  const pageTimer = document.getElementById('pageTimer');

  const prank = document.getElementById('prank');
  const hudSideCanvas = document.getElementById('hudSideCanvas');
  const picWrap = document.getElementById('picWrap');
  const logEl = document.getElementById('log');
  const barInner = document.getElementById('barInner');
  const pctEl = document.getElementById('pct');

  const thanksHackerScreen = document.getElementById('thanksHackerScreen');
  const finalBlack = document.getElementById('finalBlack');
  const canvas = document.getElementById('matrix');
  const gotchaSound = document.getElementById('gotchaSound');
  const revealSound = document.getElementById('revealSound');

  const friendlyPages = [
    { color: "#00ff88", tint: "rgba(0, 255, 136, 0.16)", title: "Warm Welcome", msg: "Glad you stopped by! Relax and enjoy the view." },
    { color: "#00e5ff", tint: "rgba(0, 229, 255, 0.16)", title: "Fresh Breeze", msg: "Taking things easy, one calm step at a time." },
    { color: "#ff4da6", tint: "rgba(255, 77, 166, 0.16)", title: "Bright Smile", msg: "A little positivity can turn any moment around." },
    { color: "#ffd000", tint: "rgba(255, 208, 0, 0.16)", title: "Sunny Mood", msg: "Good energy flowing right through this page." },
    { color: "#b366ff", tint: "rgba(179, 102, 255, 0.18)", title: "Calm Focus", msg: "No rush at all—just hang tight for a few seconds." },
    { color: "#ff6a00", tint: "rgba(255, 106, 0, 0.18)", title: "Cozy Vibe", msg: "Halfway through our friendly little tour!" },
    { color: "#2ee6a6", tint: "rgba(46, 230, 166, 0.16)", title: "Easy Going", msg: "Everything moving smoothly and quietly." },
    { color: "#4da6ff", tint: "rgba(77, 166, 255, 0.16)", title: "Clear Skies", msg: "Almost at the end of these ten stops." },
    { color: "#ff7043", tint: "rgba(255, 112, 67, 0.18)", title: "Friendly Note", msg: "Appreciate your patience—one more stop coming up!" },
    { color: "#d4ff00", tint: "rgba(212, 255, 0, 0.18)", title: "Final Stop", msg: "Step 10 wrapping up now—get ready!" }
  ];

  function getAudioContext() {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return null;
    if (!audioCtx) {
      audioCtx = new AudioContextClass();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  async function buildReversedBuffer(url) {
    if (reversedBufferCache[url]) return reversedBufferCache[url];
    const ctx = getAudioContext();
    if (!ctx) return null;
    const response = await fetch(url);
    const arrayBuffer = await response.arrayBuffer();
    const decoded = await ctx.decodeAudioData(arrayBuffer);
    const reversed = ctx.createBuffer(
      decoded.numberOfChannels,
      decoded.length,
      decoded.sampleRate
    );
    for (let ch = 0; ch < decoded.numberOfChannels; ch++) {
      const sourceData = decoded.getChannelData(ch);
      const targetData = reversed.getChannelData(ch);
      for (let i = 0, j = sourceData.length - 1; i < sourceData.length; i++, j--) {
        targetData[i] = sourceData[j];
      }
    }
    reversedBufferCache[url] = reversed;
    return reversed;
  }

  function playFallbackReverseSweep(ctx) {
    const duration = 1.4;
    const sampleRate = ctx.sampleRate;
    const frameCount = Math.floor(duration * sampleRate);
    const buffer = ctx.createBuffer(1, frameCount, sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < frameCount; i++) {
      const t = i / frameCount;
      const freq = 950 - t * 720;
      const env = Math.sin(Math.PI * t);
      data[i] = Math.sin(2 * Math.PI * freq * (i / sampleRate)) * env * 0.35;
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);
    src.start();
  }

  async function playReverseSoundOnBack() {
    const activeAudioEl = !revealSound.paused ? revealSound : gotchaSound;
    const srcUrl = activeAudioEl.getAttribute('src') || 'Glitchinng.aac';
    const currentPos = Math.max(0, activeAudioEl.currentTime || 0);

    gotchaSound.pause();
    revealSound.pause();

    const ctx = getAudioContext();
    if (!ctx) return;

    try {
      const reversedBuf = await buildReversedBuffer(srcUrl);
      if (!reversedBuf) {
        playFallbackReverseSweep(ctx);
        return;
      }
      const src = ctx.createBufferSource();
      src.buffer = reversedBuf;
      src.connect(ctx.destination);
      const reverseOffset = Math.min(
        Math.max(0, reversedBuf.duration - currentPos),
        Math.max(0, reversedBuf.duration - 0.05)
      );
      src.start(0, reverseOffset);
    } catch (_) {
      playFallbackReverseSweep(ctx);
    }
  }

  function pushGuardEntries(count = BACK_GUARD_DEPTH) {
    for (let i = 0; i < count; i++) {
      history.pushState({ lock: true, step: i + 1, t: Date.now() }, '', location.href);
    }
  }

  function armBackLock(ms = BACK_LOCK_MS, depth = BACK_GUARD_DEPTH) {
    lockExpiresAt = Date.now() + ms;
    pushGuardEntries(depth);
  }

  function isBackLocked() {
    return Date.now() < lockExpiresAt;
  }

  armBackLock(BACK_LOCK_MS, BACK_GUARD_DEPTH);

  window.addEventListener('popstate', function() {
    if (onEleventhPage) {
      playReverseSoundOnBack();
    }
    if (isBackLocked()) {
      pushGuardEntries(BACK_GUARD_DEPTH);
    }
  });

  window.addEventListener('pageshow', function() {
    if (isBackLocked()) {
      pushGuardEntries(BACK_GUARD_DEPTH);
    }
  });

  // Bold, dark & more movable Side HUD Telemetry Canvas for 11th screen
  function drawSideHud(now) {
    const ctx = hudSideCanvas.getContext('2d');
    const w = hudSideCanvas.width = hudSideCanvas.clientWidth || window.innerWidth;
    const h = hudSideCanvas.height = hudSideCanvas.clientHeight || window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    const t = now * 0.001;
    const boldGreen = '#00ff66';
    const strongTrack = 'rgba(0, 255, 102, 0.48)';
    const darkPanel = 'rgba(0, 8, 3, 0.78)';

    ctx.save();
    ctx.shadowColor = '#00ff55';
    ctx.shadowBlur = 10;
    ctx.strokeStyle = boldGreen;
    ctx.fillStyle = boldGreen;

    // Top-left moving badge
    const topShiftL = Math.sin(t * 3.5) * 5;
    ctx.fillStyle = darkPanel;
    ctx.fillRect(10 + topShiftL, 12, 122, 30);
    ctx.lineWidth = 2.2;
    ctx.strokeRect(10 + topShiftL, 12, 122, 30);
    ctx.fillStyle = boldGreen;
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.fillText('NODE // LINK', 18 + topShiftL, 24);
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.fillText(`SYNC ${Math.min(100, Math.floor(prankProgressValue))}%`, 18 + topShiftL, 36);

    // Top-right moving meter bar
    const topShiftR = Math.cos(t * 3.5) * 5;
    const rightX = Math.max(140, w - 132) + topShiftR;
    ctx.fillStyle = darkPanel;
    ctx.fillRect(rightX, 12, 122, 30);
    ctx.lineWidth = 2.2;
    ctx.strokeRect(rightX, 12, 122, 30);
    const barFillW = Math.max(12, ((Math.sin(t * 5.2) + 1) * 0.5) * 106);
    ctx.fillStyle = '#00ff66';
    ctx.fillRect(rightX + 8, 20, barFillW, 14);

    // Left-side fast-rotating spoke blades with subtle vertical glide
    const lx = Math.min(82, w * 0.14) + Math.sin(t * 2.4) * 6;
    const ly = h * 0.34 + Math.cos(t * 3.1) * 10;
    const lr = Math.min(56, w * 0.115);
    ctx.lineWidth = 2;
    ctx.strokeStyle = strongTrack;
    ctx.beginPath();
    ctx.arc(lx, ly, lr, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(lx, ly, lr * 0.52, t * 2.5, t * 2.5 + Math.PI * 1.35);
    ctx.stroke();

    const spokes = 8;
    for (let i = 0; i < spokes; i++) {
      const ang = (i / spokes) * Math.PI * 2 + t * 2.3;
      const pulse = 0.5 + 0.5 * Math.sin(t * 8 + i * 1.1);
      const rInner = lr * 0.26;
      const rOuter = lr * (0.68 + 0.32 * pulse);
      ctx.strokeStyle = boldGreen;
      ctx.fillStyle = 'rgba(0, 255, 102, 0.32)';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(lx + Math.cos(ang - 0.14) * rInner, ly + Math.sin(ang - 0.14) * rInner);
      ctx.lineTo(lx + Math.cos(ang) * rOuter, ly + Math.sin(ang) * rOuter);
      ctx.lineTo(lx + Math.cos(ang + 0.14) * rInner, ly + Math.sin(ang + 0.14) * rInner);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // Left-lower movable telemetry block
    const lBoxX = 10 + Math.cos(t * 2.8) * 6;
    const lBoxY = h * 0.56 + Math.sin(t * 2.2) * 8;
    ctx.fillStyle = darkPanel;
    ctx.fillRect(lBoxX, lBoxY, 98, 78);
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = boldGreen;
    ctx.strokeRect(lBoxX, lBoxY, 98, 78);
    ctx.fillStyle = boldGreen;
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.fillText(`PKT ${Math.floor(400 + ((t * 260) % 599))}`, lBoxX + 7, lBoxY + 17);
    ctx.fillText(`LAT ${Math.floor(8 + ((t * 64) % 58))}ms`, lBoxX + 7, lBoxY + 33);
    ctx.fillText(`CH-0${(Math.floor(t * 4) % 8) + 1}`, lBoxX + 7, lBoxY + 49);
    ctx.fillText(`HEX ${((Math.floor(t * 511) % 255).toString(16).toUpperCase().padStart(2, '0'))}F9`, lBoxX + 7, lBoxY + 65);

    // Right-side dynamic circular gauge with counter-orbiting arc
    const rx = Math.max(w - 82, w * 0.86) + Math.cos(t * 2.4) * 6;
    const ry = h * 0.34 + Math.sin(t * 3.1) * 10;
    const rr = Math.min(52, w * 0.11);
    ctx.lineWidth = 2;
    ctx.strokeStyle = strongTrack;
    ctx.beginPath();
    ctx.arc(rx, ry, rr, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = boldGreen;
    ctx.beginPath();
    ctx.arc(rx, ry, rr + 4, -t * 3.2, -t * 3.2 + Math.PI * 0.85);
    ctx.stroke();

    const gaugeVal = Math.min(100, Math.floor(prankProgressValue));
    const sweepEnd = -Math.PI / 2 + (gaugeVal / 100) * Math.PI * 2;
    ctx.strokeStyle = boldGreen;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(rx, ry, rr - 6, -Math.PI / 2, sweepEnd);
    ctx.stroke();

    ctx.lineWidth = 2;
    ctx.fillStyle = boldGreen;
    ctx.font = 'bold 14px "Courier New", monospace';
    const gText = String(gaugeVal);
    ctx.fillText(gText, rx - ctx.measureText(gText).width / 2, ry + 5);

    // Right-lower high-motion waveform box
    const bx = Math.max(w - 108, w - 108) + Math.sin(t * 2.8) * 6;
    const by = h * 0.56 + Math.cos(t * 2.2) * 8;
    ctx.fillStyle = darkPanel;
    ctx.fillRect(bx, by, 98, 78);
    ctx.lineWidth = 2.2;
    ctx.strokeRect(bx, by, 98, 78);

    ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let x = 6; x <= 92; x += 2.5) {
      const norm = x / 92;
      const env = Math.sin(norm * Math.PI);
      const amp = Math.sin(x * 0.28 + t * 15) * Math.cos(x * 0.12 - t * 8) * 24 * env;
      const py = by + 39 + amp;
      if (x === 6) ctx.moveTo(bx + x, py);
      else ctx.lineTo(bx + x, py);
    }
    ctx.stroke();

    // Connecting bold circuit lines & moving pulse dot along bottom edge
    ctx.lineWidth = 2;
    ctx.strokeStyle = strongTrack;
    ctx.beginPath();
    ctx.moveTo(lBoxX + 98, lBoxY + 39);
    ctx.lineTo(126, lBoxY + 39);
    ctx.lineTo(126, h - 18);
    ctx.lineTo(w - 126, h - 18);
    ctx.lineTo(w - 126, by + 39);
    ctx.lineTo(bx, by + 39);
    ctx.stroke();

    const pulseProg = (t * 0.85) % 1;
    const pulseX = 126 + pulseProg * Math.max(40, w - 252);
    ctx.fillStyle = boldGreen;
    ctx.beginPath();
    ctx.arc(pulseX, h - 18, 4.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    if (onEleventhPage) {
      hudAnimId = requestAnimationFrame(drawSideHud);
    }
  }

  function startSideHud() {
    stopSideHud();
    hudAnimId = requestAnimationFrame(drawSideHud);
  }

  function stopSideHud() {
    if (hudAnimId) {
      cancelAnimationFrame(hudAnimId);
      hudAnimId = null;
    }
  }

  // Matrix rain background
  let matrixInterval = null;
  function startMatrix(){
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');
    function resize(){
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    const chars = "01";
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = new Array(columns).fill(1);
    if (matrixInterval) clearInterval(matrixInterval);
    matrixInterval = setInterval(() => {
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#0f0';
      ctx.font = fontSize + 'px monospace';
      for (let i=0;i<drops.length;i++){
        const text = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);
        if (drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }, 45);
  }

  function stopMatrix(){
    if (matrixInterval) {
      clearInterval(matrixInterval);
      matrixInterval = null;
    }
    canvas.style.display = 'none';
  }

  function clearStepTimers(){
    if (stepInterval) { clearInterval(stepInterval); stepInterval = null; }
    if (stepTimeout) { clearTimeout(stepTimeout); stepTimeout = null; }
  }

  function showFriendlyPage(index){
    clearStepTimers();
    currentIndex = index;
    const item = friendlyPages[index];

    friendlyPage.style.setProperty('--theme', item.color);
    friendlyPage.style.setProperty('--tint', item.tint);
    pageBadge.textContent = `PAGE ${index + 1} / 10`;
    pageTitle.textContent = item.title;
    pageMsg.textContent = item.msg;
    pageBar.style.width = '0%';
    pageTimer.textContent = '5s';

    friendlyPage.classList.remove('show');
    void friendlyPage.offsetWidth;
    friendlyPage.classList.add('show');

    const startTime = Date.now();
    stepInterval = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const pct = Math.min(100, (elapsed / STEP_DURATION_MS) * 100);
      const leftSec = Math.max(0, Math.ceil((STEP_DURATION_MS - elapsed) / 1000));
      pageBar.style.width = pct + '%';
      pageTimer.textContent = `${leftSec}s`;
    }, 50);

    stepTimeout = setTimeout(() => {
      clearStepTimers();
      if (index < friendlyPages.length - 1) {
        showFriendlyPage(index + 1);
      } else {
        openEleventhOriginalPrank();
      }
    }, STEP_DURATION_MS);
  }

  const lines = [
    { text: "> connecting to device...", bad:false },
    { text: "> access granted", bad:false },
    { text: "> scanning system...", bad:false },
    { text: "> unauthorized access detected", bad:true },
    { text: "> running deep scan...", bad:true },
    { text: "> system compromised", bad:true },
    { text: "> Whatsappp Access Granted", bad:false },
    { text: "> Whatsapp OTP Crashing", bad:false },
    { text: "> Whatsapp Chat Transfering", bad:true },
    { text: "> Browser Watch History", bad:true },
  ];

  function addLine(i){
    if (i >= lines.length) return;
    const d = document.createElement('div');
    d.textContent = lines[i].text;
    if (lines[i].bad) d.classList.add('bad');
    logEl.appendChild(d);
    requestAnimationFrame(()=> d.classList.add('on'));
  }

  function openEleventhOriginalPrank(){
    clearStepTimers();
    onEleventhPage = true;
    prankProgressValue = 0;
    armBackLock(BACK_LOCK_MS, BACK_GUARD_DEPTH);
    buildReversedBuffer('Glitchinng.aac').catch(() => {});
    buildReversedBuffer('Gotcha.aac').catch(() => {});

    friendlyPage.classList.remove('show');
    prank.style.display = 'flex';
    startMatrix();
    startSideHud();

    picWrap.classList.remove('show');
    logEl.innerHTML = '';
    barInner.style.width = '0%';
    pctEl.textContent = '0%';

    gotchaSound.currentTime = 0;
    gotchaSound.play().catch(() => {});

    setTimeout(()=> picWrap.classList.add('show'), 150);

    const lineDelay = 500;
    lines.forEach((l, i) => {
      setTimeout(()=> addLine(i), 450 + i*lineDelay);
    });

    let pct = 0;
    const totalDuration = 14000;
    const stepTime = 40;
    const steps = totalDuration / stepTime;
    const increment = 100 / steps;
    const barTimer = setInterval(()=>{
      pct = Math.min(100, pct + increment);
      prankProgressValue = pct;
      barInner.style.width = pct + '%';
      pctEl.textContent = Math.floor(pct) + '%';
      if (pct >= 100){
        clearInterval(barTimer);
      }
    }, stepTime);

    setTimeout(()=>{
      stage.classList.add('flash');
    }, totalDuration + 700);

    setTimeout(()=>{
      stage.classList.remove('flash');
      stopSideHud();
      prank.style.display = 'none';
      thanksHackerScreen.classList.add('show');
      gotchaSound.pause();
      revealSound.currentTime = 0;
      revealSound.play().catch(() => {});
    }, totalDuration + 1100);

    setTimeout(()=>{
      onEleventhPage = false;
      stopSideHud();
      thanksHackerScreen.classList.remove('show');
      stopMatrix();
      revealSound.pause();
      finalBlack.classList.add('show');
    }, totalDuration + 1100 + 10000);
  }

  startBtn.addEventListener('click', function(){
    getAudioContext();
    armBackLock(BACK_LOCK_MS, BACK_GUARD_DEPTH);
    startScreen.style.display = 'none';
    showFriendlyPage(0);
  });

  startMatrix();
})();
</script>
