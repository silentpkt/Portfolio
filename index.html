<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Friendly Node</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    width:100%; height:100%; background:#000; overflow:hidden;
    font-family: 'Courier New', monospace;
    color:#0f0;
  }
  #stage {
    position:fixed; inset:0; background:#000;
    display:flex; align-items:center; justify-content:center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition: box-shadow 0.25s ease;
  }
  #stage.stepGlowActive {
    --step-glow: rgba(0, 255, 102, 0.28);
    box-shadow: inset 0 0 95px var(--step-glow), inset 0 0 30px rgba(0, 0, 0, 0.9);
  }

  canvas#matrix { position:absolute; inset:0; width:100%; height:100%; display:block; opacity:0.45; z-index:2; }
  canvas#stepHackerCanvas { position:absolute; inset:0; width:100%; height:100%; display:none; opacity:0.92; z-index:4; pointer-events:none; }

  #stage::before {
    content:""; position:absolute; inset:0; pointer-events:none; z-index:45;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  /* ---------- START SCREEN ---------- */
  #startScreen {
    position:relative; width:92%; max-width:420px; z-index:20;
    padding:28px 22px; border-radius:12px;
    border:1.5px solid #00ff88;
    background: rgba(0, 15, 8, 0.88);
    box-shadow: 0 0 25px rgba(0, 255, 136, 0.25);
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:16px;
  }
  #startScreen h1 {
    font-size:1.3rem; color:#00ff88; text-shadow:0 0 10px rgba(0,255,136,0.5);
  }
  #startScreen p {
    font-size:0.92rem; color:#d8ffe8; line-height:1.5;
  }

  /* ---------- 10 DARK HACKER STEP PAGES (LOADING BAR + SHORT LABEL ONLY) ---------- */
  #friendlyPage {
    --theme: #00ff66;
    --tint: rgba(0, 255, 102, 0.16);
    position:relative; width:92%; max-width:410px; z-index:15;
    display:none; flex-direction:column; align-items:center; text-align:center; gap:14px;
    padding:24px 20px; border-radius:10px;
    border:1.5px solid var(--theme);
    background:
      radial-gradient(circle at 50% 35%, var(--tint) 0%, rgba(2, 6, 4, 0.92) 76%),
      linear-gradient(rgba(0, 255, 102, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 102, 0.06) 1px, transparent 1px);
    background-size: 100% 100%, 18px 18px, 18px 18px;
    box-shadow: 0 0 28px color-mix(in srgb, var(--theme) 45%, transparent), inset 0 0 28px rgba(0, 0, 0, 0.85);
    animation: pagePop 0.2s ease-out;
  }
  #friendlyPage.show {
    display:flex;
    animation: pagePop 0.2s ease-out, stepGlowPulse 1.1s ease-in-out infinite alternate;
  }

  @keyframes stepGlowPulse {
    0% {
      box-shadow:
        0 0 18px color-mix(in srgb, var(--theme) 35%, transparent),
        0 0 42px color-mix(in srgb, var(--theme) 18%, transparent),
        inset 0 0 22px rgba(0, 0, 0, 0.85);
    }
    100% {
      box-shadow:
        0 0 32px color-mix(in srgb, var(--theme) 72%, transparent),
        0 0 70px color-mix(in srgb, var(--theme) 36%, transparent),
        inset 0 0 32px color-mix(in srgb, var(--theme) 16%, transparent);
    }
  }

  @keyframes pagePop {
    from { opacity:0; transform: scale(0.97) translateY(5px); }
    to { opacity:1; transform: scale(1) translateY(0); }
  }

  .friendlyTitle {
    font-size:1.25rem; font-weight:bold; letter-spacing:3px; color:var(--theme);
    text-shadow:0 0 12px color-mix(in srgb, var(--theme) 70%, transparent);
  }

  .miniBarWrap {
    width:100%; height:12px; border-radius:4px; overflow:hidden;
    border:1.5px solid var(--theme); background:rgba(0,0,0,0.85);
    box-shadow:0 0 12px color-mix(in srgb, var(--theme) 28%, transparent);
  }
  .miniBarFill {
    height:100%; width:0%; background:var(--theme);
    box-shadow:0 0 14px var(--theme);
  }
  .timerLabel {
    font-size:0.82rem; color:var(--theme); letter-spacing:2px; font-weight:bold;
    text-shadow:0 0 8px color-mix(in srgb, var(--theme) 55%, transparent);
  }

  .actionBtn {
    background:rgba(0, 0, 0, 0.72);
    border:2px solid var(--theme, #00ff88);
    color:var(--theme, #00ff88);
    padding:14px 30px; font-family:inherit; font-size:1rem; font-weight:bold;
    letter-spacing:1.5px; border-radius:8px; cursor:pointer;
    box-shadow:0 0 16px color-mix(in srgb, var(--theme, #00ff88) 35%, transparent);
    transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease;
  }
  .actionBtn:active {
    transform:scale(0.96);
    background:var(--theme, #00ff88);
    color:#000;
  }

  /* ---------- 11TH STEP: ORIGINAL PRANK SCREEN + SIDE TECH HUD + RED GLOW & BRIGHTNESS FLICKER ---------- */
  #prank {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:flex-start;
    z-index:25; padding-top: max(24px, env(safe-area-inset-top));
    overflow:hidden;
  }

  #prank.redFlickerActive {
    animation: brightnessPulse 0.14s infinite alternate;
  }

  @keyframes brightnessPulse {
    0% { filter: brightness(0.42) contrast(1.25); }
    50% { filter: brightness(1.55) contrast(1.35); }
    100% { filter: brightness(0.65) contrast(1.2); }
  }

  #redGlowOverlay {
    position:absolute; inset:0; pointer-events:none; z-index:27;
    background:
      radial-gradient(circle at 50% 50%, rgba(255, 0, 25, 0.14) 0%, rgba(255, 0, 0, 0.56) 76%, rgba(190, 0, 0, 0.82) 100%);
    box-shadow: inset 0 0 110px rgba(255, 20, 20, 0.9), inset 0 0 40px rgba(255, 0, 0, 0.95);
    animation: redGlowPulse 0.18s infinite alternate;
  }

  @keyframes redGlowPulse {
    0% { opacity: 0.45; }
    100% { opacity: 1; }
  }

  canvas#hudSideCanvas {
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:26; opacity:0.98;
  }

  #picWrap, #log, #barOuter, #pct {
    position:relative; z-index:29;
  }

  #picWrap {
    position:relative; width:44vw; max-width:210px; aspect-ratio:1/1;
    border-radius:10px; overflow:hidden; margin-top:4.5vh;
    box-shadow: 0 0 0 3px #ff2a2a, 0 0 28px 6px rgba(255, 25, 25, 0.85);
    opacity:0; transform: scale(0.7);
  }
  #picWrap.show {
    animation: popIn .35s ease-out forwards, glitchShake .12s steps(2) infinite;
  }
  #picWrap img {
    width:100%; height:100%; object-fit:cover; display:block;
    filter: grayscale(1) brightness(0.9) contrast(1.3) sepia(1) hue-rotate(60deg) saturate(4);
    mix-blend-mode: normal;
  }
  #picWrap::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 2px,
      transparent 2px, transparent 4px
    );
    mix-blend-mode: overlay;
  }

  @keyframes popIn {
    0% { opacity:0; transform:scale(0.6); }
    60% { opacity:1; transform:scale(1.05); }
    100% { opacity:1; transform:scale(1); }
  }
  @keyframes glitchShake {
    0% { transform: translate(0,0); }
    50% { transform: translate(1px,-1px); }
    100% { transform: translate(-1px,1px); }
  }

  #log {
    margin-top:3vh; width:88%; max-width:440px; font-size:0.88rem;
    line-height:1.55; text-shadow:0 0 6px #0f0;
    background: rgba(18, 2, 2, 0.82);
    padding: 8px 12px; border-radius: 6px;
    border: 1.5px solid rgba(255, 50, 50, 0.7);
  }
  #log div { opacity:0; white-space:pre-wrap; }
  #log div.on { opacity:1; }
  #log .bad { color:#ff3b3b; text-shadow:0 0 8px #ff2222; font-weight:bold; }

  #barOuter {
    margin-top:2vh; width:88%; max-width:440px; height:16px;
    border:1.5px solid #ff3b3b; border-radius:3px; overflow:hidden;
    background: rgba(15, 2, 2, 0.9);
    box-shadow: 0 0 14px rgba(255, 40, 40, 0.45);
  }
  #barInner { height:100%; width:0%; background:#ff3b3b; box-shadow:0 0 14px #ff2222; }

  #pct { margin-top:8px; font-size:0.85rem; letter-spacing:1px; font-weight:bold; color:#ff5555; text-shadow:0 0 8px #ff0000; }

  .flash { animation: flashbang 0.35s steps(3) forwards; }
  @keyframes flashbang {
    0% { filter: invert(0); }
    30% { filter: invert(1) hue-rotate(180deg); }
    60% { filter: invert(0.3); }
    100% { filter: invert(0); }
  }

  /* ---------- THANKS BUDDY HACKER SCREEN ---------- */
  #thanksHackerScreen {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:
      radial-gradient(circle at 50% 40%, rgba(0, 255, 70, 0.16) 0%, rgba(0, 0, 0, 0.92) 72%),
      linear-gradient(rgba(0, 255, 0, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 0, 0.08) 1px, transparent 1px);
    background-size: 100% 100%, 24px 24px, 24px 24px;
    color:#0f0; padding:8vw; gap:16px; z-index:40;
  }
  #thanksHackerScreen.show {
    display:flex;
    animation: fadeIn .35s ease-out, hackerPulse 1.4s ease-in-out infinite;
  }
  @keyframes hackerPulse {
    0%, 100% { box-shadow: inset 0 0 70px rgba(0, 255, 0, 0.25); }
    50% { box-shadow: inset 0 0 150px rgba(0, 255, 0, 0.55); }
  }
  #thanksHackerScreen .emoji {
    font-size:3.4rem;
    animation: glitchShake .15s steps(2) infinite;
  }
  @keyframes glitchShake {
    0% { transform: translate(0,0); }
    50% { transform: translate(2px,-1px); }
    100% { transform: translate(-2px,1px); }
  }
  #thanksHackerScreen h2 {
    font-size:1.45rem; color:#ff3b3b;
    text-shadow:0 0 12px #ff3b3b, 0 0 4px #0f0; letter-spacing:1px;
  }
  #thanksHackerScreen p {
    font-size:1rem; color:#9effa0; max-width:340px; line-height:1.5;
    text-shadow:0 0 8px rgba(0,255,0,0.6);
  }
  #alreadyOpenedScreen {
    position:relative; width:92%; max-width:420px; z-index:60;
    padding:28px 22px; border-radius:12px;
    border:1.5px solid #ff3b3b;
    background: rgba(18, 0, 4, 0.94);
    box-shadow: 0 0 28px rgba(255, 59, 59, 0.3);
    display:none; flex-direction:column; align-items:center; text-align:center; gap:14px;
  }
  #alreadyOpenedScreen.show { display:flex; }

  /* ---------- FINAL BLACK SCREEN ---------- */
  #finalBlack {
    position:absolute; inset:0; background:#000; display:none; z-index:55;
  }
  #finalBlack.show { display:block; animation: fadeIn .5s ease-out; }

  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
</style>
</head>
<body>
<div id="stage">
  <audio id="gotchaSound" src="Glitchinng.aac" preload="auto"></audio>
  <audio id="revealSound" src="Gotcha.aac" preload="auto"></audio>

  <canvas id="matrix"></canvas>
  <canvas id="stepHackerCanvas"></canvas>

  <!-- Start Screen -->
  <div id="startScreen">
    <h1>👋 Hey Friend!</h1>
    <p>Tap the button below to start a smooth 10-step friendly visit.</p>
    <button id="startBtn" class="actionBtn" style="--theme:#00ff88; --tint:rgba(0,255,136,0.14);">PRESS TO START</button>
  </div>
  <!-- Already Opened Lock Screen -->
  <div id="alreadyOpenedScreen">
    <h1>⛔ ACCESS LOCKED</h1>
    <p>This link has already been opened once and cannot be started again.</p>
  </div>

  <!-- 10 Dark Hacker Step Pages (Short Word + Loading Bar Only) -->
  <div id="friendlyPage">
    <h2 id="pageTitle" class="friendlyTitle">NODE 01</h2>
    <div class="miniBarWrap">
      <div id="pageBar" class="miniBarFill"></div>
    </div>
    <div id="pageTimer" class="timerLabel">1s</div>
  </div>

  <!-- 11th Step: Original Prank Screen + Side HUD + Red Glow & Warning Signs -->
  <div id="prank">
    <canvas id="hudSideCanvas"></canvas>
    <div id="redGlowOverlay"></div>
    <div id="picWrap"><img src="photo.jpg" alt=""></div>
    <div id="log"></div>
    <div id="barOuter"><div id="barInner"></div></div>
    <div id="pct">0%</div>
  </div>

  <!-- Thanks Buddy Hacker Screen -->
  <div id="thanksHackerScreen">
    <div class="emoji">🥷 💀</div>
    <h2>💀 Thanks Buddy for access.</h2>
    <p>Welcome to RpJword ,The depth of black trick.</p>
  </div>

  <!-- Final Black Screen -->
  <div id="finalBlack"></div>
</div>

<script>
  const ONE_TIME_KEY = 'rpj_one_time_link_opened_v1';
  let isBlockedSecondVisit = false;
  const alreadyOpenedScreen = document.getElementById('alreadyOpenedScreen');

  function hasOpenedBefore() {
    try { if (localStorage.getItem(ONE_TIME_KEY) === '1') return true; } catch (_) {}
    try { if (sessionStorage.getItem(ONE_TIME_KEY) === '1') return true; } catch (_) {}
    return false;
  }

  function markAsOpened() {
    try { localStorage.setItem(ONE_TIME_KEY, '1'); } catch (_) {}
    try { sessionStorage.setItem(ONE_TIME_KEY, '1'); } catch (_) {}
  }

  function lockOutSecondVisit() {
    isBlockedSecondVisit = true;
    onEleventhPage = false;
    clearStepTimers();
    startScreen.style.display = 'none';
    friendlyPage.classList.remove('show');
    prank.style.display = 'none';
    thanksHackerScreen.classList.remove('show');
    finalBlack.classList.remove('show');
    alreadyOpenedScreen.classList.add('show');
  }
(function(){
  const BACK_LOCK_MS = 90000000;
  const BACK_GUARD_DEPTH = 200000;
  const STEP_DURATION_MS = 1000;

  let lockExpiresAt = Date.now() + BACK_LOCK_MS;
  let currentIndex = 0;
  let onEleventhPage = false;
  let onFriendlySteps = false;
  let stepInterval = null;
  let stepTimeout = null;
  let hudAnimId = null;
  let stepHackerAnimId = null;
  let prankProgressValue = 0;

  let audioCtx = null;
  const reversedBufferCache = {};

  const stage = document.getElementById('stage');
  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');
  const friendlyPage = document.getElementById('friendlyPage');
  const pageTitle = document.getElementById('pageTitle');
  const pageBar = document.getElementById('pageBar');
  const pageTimer = document.getElementById('pageTimer');
  const stepHackerCanvas = document.getElementById('stepHackerCanvas');

  const prank = document.getElementById('prank');
  const hudSideCanvas = document.getElementById('hudSideCanvas');
  const picWrap = document.getElementById('picWrap');
  const logEl = document.getElementById('log');
  const barInner = document.getElementById('barInner');
  const pctEl = document.getElementById('pct');

  const thanksHackerScreen = document.getElementById('thanksHackerScreen');
  const finalBlack = document.getElementById('finalBlack');
  const canvas = document.getElementById('matrix');
  const gotchaSound = document.getElementById('gotchaSound');
  const revealSound = document.getElementById('revealSound');

  const friendlyPages = [
    { color: "#00ff66", glow: "rgba(0, 255, 102, 0.34)", tint: "rgba(0, 255, 102, 0.18)", title: "NODE 01" },
    { color: "#ff2a4b", glow: "rgba(255, 42, 75, 0.34)", tint: "rgba(255, 42, 75, 0.18)", title: "TRACE 02" },
    { color: "#00e5ff", glow: "rgba(0, 229, 255, 0.34)", tint: "rgba(0, 229, 255, 0.18)", title: "SHELL 03" },
    { color: "#ff5500", glow: "rgba(255, 85, 0, 0.34)", tint: "rgba(255, 85, 0, 0.18)", title: "PROBE 04" },
    { color: "#b366ff", glow: "rgba(179, 102, 255, 0.36)", tint: "rgba(179, 102, 255, 0.20)", title: "CRYPT 05" },
    { color: "#ff1e56", glow: "rgba(255, 30, 86, 0.36)", tint: "rgba(255, 30, 86, 0.20)", title: "HOOK 06" },
    { color: "#00ffaa", glow: "rgba(0, 255, 170, 0.34)", tint: "rgba(0, 255, 170, 0.18)", title: "DUMP 07" },
    { color: "#ff3b3b", glow: "rgba(255, 59, 59, 0.36)", tint: "rgba(255, 59, 59, 0.20)", title: "BYPASS 08" },
    { color: "#aaff00", glow: "rgba(170, 255, 0, 0.34)", tint: "rgba(170, 255, 0, 0.18)", title: "INJECT 09" },
    { color: "#ff0044", glow: "rgba(255, 0, 68, 0.40)", tint: "rgba(255, 0, 68, 0.22)", title: "ROOT 10" }
  ];

  // Hacker hex lanes & pulsing nodes for the 10 loading steps
  const hexLanes = Array.from({ length: 12 }, (_, idx) => ({
    xRatio: (idx + 0.5) / 12,
    y: Math.random() * 600,
    speed: 2.2 + (idx % 4) * 1.15,
    seed: idx * 37
  }));

  function getAudioContext() {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return null;
    if (!audioCtx) {
      audioCtx = new AudioContextClass();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  async function buildReversedBuffer(url) {
    if (reversedBufferCache[url]) return reversedBufferCache[url];
    const ctx = getAudioContext();
    if (!ctx) return null;
    const response = await fetch(url);
    const arrayBuffer = await response.arrayBuffer();
    const decoded = await ctx.decodeAudioData(arrayBuffer);
    const reversed = ctx.createBuffer(
      decoded.numberOfChannels,
      decoded.length,
      decoded.sampleRate
    );
    for (let ch = 0; ch < decoded.numberOfChannels; ch++) {
      const sourceData = decoded.getChannelData(ch);
      const targetData = reversed.getChannelData(ch);
      for (let i = 0, j = sourceData.length - 1; i < sourceData.length; i++, j--) {
        targetData[i] = sourceData[j];
      }
    }
    reversedBufferCache[url] = reversed;
    return reversed;
  }

  function playFallbackReverseSweep(ctx) {
    const duration = 1.4;
    const sampleRate = ctx.sampleRate;
    const frameCount = Math.floor(duration * sampleRate);
    const buffer = ctx.createBuffer(1, frameCount, sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < frameCount; i++) {
      const t = i / frameCount;
      const freq = 950 - t * 720;
      const env = Math.sin(Math.PI * t);
      data[i] = Math.sin(2 * Math.PI * freq * (i / sampleRate)) * env * 0.35;
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);
    src.start();
  }

  async function playReverseSoundOnBack() {
    const activeAudioEl = !revealSound.paused ? revealSound : gotchaSound;
    const srcUrl = activeAudioEl.getAttribute('src') || 'Glitchinng.aac';
    const currentPos = Math.max(0, activeAudioEl.currentTime || 0);

    gotchaSound.pause();
    revealSound.pause();

    const ctx = getAudioContext();
    if (!ctx) return;

    try {
      const reversedBuf = await buildReversedBuffer(srcUrl);
      if (!reversedBuf) {
        playFallbackReverseSweep(ctx);
        return;
      }
      const src = ctx.createBufferSource();
      src.buffer = reversedBuf;
      src.connect(ctx.destination);
      const reverseOffset = Math.min(
        Math.max(0, reversedBuf.duration - currentPos),
        Math.max(0, reversedBuf.duration - 0.05)
      );
      src.start(0, reverseOffset);
    } catch (_) {
      playFallbackReverseSweep(ctx);
    }
  }

  function pushGuardEntries(count = BACK_GUARD_DEPTH) {
    for (let i = 0; i < count; i++) {
      history.pushState({ lock: true, step: i + 1, t: Date.now() }, '', location.href);
    }
  }

  function armBackLock(ms = BACK_LOCK_MS, depth = BACK_GUARD_DEPTH) {
    lockExpiresAt = Date.now() + ms;
    pushGuardEntries(depth);
  }

  function isBackLocked() {
    return Date.now() < lockExpiresAt;
  }

  armBackLock(BACK_LOCK_MS, BACK_GUARD_DEPTH);

  window.addEventListener('popstate', function() {
    if (isBlockedSecondVisit || hasOpenedBefore()) {
      lockOutSecondVisit();
      return;
    }
    if (onEleventhPage) {
      playReverseSoundOnBack();
    }
    if (isBackLocked()) {
      pushGuardEntries(BACK_GUARD_DEPTH);
    }
  });

  window.addEventListener('pageshow', function() {
    if (isBlockedSecondVisit || hasOpenedBefore()) {
      lockOutSecondVisit();
      return;
    }
    if (isBackLocked()) {
      pushGuardEntries(BACK_GUARD_DEPTH);
    }
  });

  // Full Hacker Vibe Background Animation (Hex stream + pulsing circuit nodes + screen glow)
  function drawStepHackerBg(now) {
    if (!onFriendlySteps) return;
    const ctx = stepHackerCanvas.getContext('2d');
    const w = stepHackerCanvas.width = stepHackerCanvas.clientWidth || window.innerWidth;
    const h = stepHackerCanvas.height = stepHackerCanvas.clientHeight || window.innerHeight;
    const item = friendlyPages[currentIndex] || friendlyPages[0];
    const accent = item.color;
    const t = now * 0.001;
    const glowStrength = 0.65 + 0.35 * Math.sin(t * 6.5);

    ctx.clearRect(0, 0, w, h);
    ctx.save();

    // Glowing radial screen vignette
    const rad = ctx.createRadialGradient(w * 0.5, h * 0.5, Math.min(w, h) * 0.12, w * 0.5, h * 0.5, Math.max(w, h) * 0.72);
    rad.addColorStop(0, 'rgba(0, 0, 0, 0.12)');
    rad.addColorStop(0.75, item.tint);
    rad.addColorStop(1, item.glow);
    ctx.fillStyle = rad;
    ctx.fillRect(0, 0, w, h);

    // Sweeping horizontal radar / exploit pulse line
    const sweepY = ((t * 210) % (h + 120)) - 60;
    const band = ctx.createLinearGradient(0, sweepY - 34, 0, sweepY + 34);
    band.addColorStop(0, 'rgba(0,0,0,0)');
    band.addColorStop(0.5, item.tint);
    band.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = band;
    ctx.fillRect(0, sweepY - 34, w, 68);

    ctx.strokeStyle = accent;
    ctx.globalAlpha = 0.55 * glowStrength;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(0, sweepY);
    ctx.lineTo(w, sweepY);
    ctx.stroke();

    // Animated hex byte streams & network nodes
    ctx.font = 'bold 11px "Courier New", monospace';
    hexLanes.forEach((lane, i) => {
      lane.y += lane.speed;
      if (lane.y > h + 40) lane.y = -40;

      const lx = lane.xRatio * w;
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = accent;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(lx, 0);
      ctx.lineTo(lx, h);
      ctx.stroke();

      for (let r = 0; r < 5; r++) {
        const yy = ((lane.y + r * 36) % (h + 60)) - 30;
        const hexVal = (((Math.floor(t * 17) + lane.seed + r * 19) % 255)
          .toString(16)
          .toUpperCase()
          .padStart(2, '0'));
        ctx.globalAlpha = r === 0 ? 0.85 * glowStrength : 0.38;
        ctx.fillStyle = r === 0 ? '#ffffff' : accent;
        ctx.fillText('0x' + hexVal, lx - 14, yy);
      }

      // Pulsing hacker node ring
      const nodeY = ((t * 130 + i * 75) % (h - 40)) + 20;
      const pulseR = 5 + 4 * (0.5 + 0.5 * Math.sin(t * 7 + i));
      ctx.globalAlpha = 0.72 * glowStrength;
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(lx, nodeY, pulseR, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = accent;
      ctx.beginPath();
      ctx.arc(lx, nodeY, 2.2, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();
    stepHackerAnimId = requestAnimationFrame(drawStepHackerBg);
  }

  function startStepHackerBg() {
    stopStepHackerBg();
    onFriendlySteps = true;
    stepHackerCanvas.style.display = 'block';
    stage.classList.add('stepGlowActive');
    stepHackerAnimId = requestAnimationFrame(drawStepHackerBg);
  }

  function stopStepHackerBg() {
    onFriendlySteps = false;
    if (stepHackerAnimId) {
      cancelAnimationFrame(stepHackerAnimId);
      stepHackerAnimId = null;
    }
    stepHackerCanvas.style.display = 'none';
    stage.classList.remove('stepGlowActive');
  }

  function drawWarningSign(ctx, cx, cy, size, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = 'rgba(120, 0, 0, 0.72)';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(cx, cy - size);
    ctx.lineTo(cx + size * 0.92, cy + size * 0.72);
    ctx.lineTo(cx - size * 0.92, cy + size * 0.72);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = color;
    ctx.fillRect(cx - 2, cy - size * 0.34, 4, size * 0.62);
    ctx.beginPath();
    ctx.arc(cx, cy + size * 0.45, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Bold Side HUD Telemetry + Red Warning Signs for 11th screen
  function drawSideHud(now) {
    const ctx = hudSideCanvas.getContext('2d');
    const w = hudSideCanvas.width = hudSideCanvas.clientWidth || window.innerWidth;
    const h = hudSideCanvas.height = hudSideCanvas.clientHeight || window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    const t = now * 0.001;
    const boldGreen = '#00ff66';
    const warnRed = '#ff2a2a';
    const brightRed = '#ff5252';
    const strongTrack = 'rgba(255, 50, 50, 0.55)';
    const darkRedPanel = 'rgba(22, 2, 2, 0.84)';
    const warnFlash = Math.sin(t * 22) > 0;

    ctx.save();
    ctx.shadowColor = warnFlash ? '#ff1a1a' : '#00ff55';
    ctx.shadowBlur = 12;

    const topShiftL = Math.sin(t * 3.5) * 5;
    ctx.fillStyle = darkRedPanel;
    ctx.fillRect(10 + topShiftL, 12, 128, 32);
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = warnFlash ? brightRed : warnRed;
    ctx.strokeRect(10 + topShiftL, 12, 128, 32);
    drawWarningSign(ctx, 24 + topShiftL, 28, 9, brightRed);
    ctx.fillStyle = brightRed;
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.fillText('! ALERT // LOCK', 38 + topShiftL, 25);
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.fillText(`SYNC ${Math.min(100, Math.floor(prankProgressValue))}%`, 38 + topShiftL, 38);

    const topShiftR = Math.cos(t * 3.5) * 5;
    const rightX = Math.max(140, w - 134) + topShiftR;
    ctx.fillStyle = darkRedPanel;
    ctx.fillRect(rightX, 12, 124, 32);
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = warnFlash ? brightRed : warnRed;
    ctx.strokeRect(rightX, 12, 124, 32);
    const barFillW = Math.max(12, ((Math.sin(t * 6.5) + 1) * 0.5) * 108);
    ctx.fillStyle = warnFlash ? '#ff2a2a' : '#ff6b6b';
    ctx.fillRect(rightX + 8, 21, barFillW, 14);

    const lx = Math.min(82, w * 0.14) + Math.sin(t * 2.4) * 6;
    const ly = h * 0.34 + Math.cos(t * 3.1) * 10;
    const lr = Math.min(56, w * 0.115);
    ctx.lineWidth = 2;
    ctx.strokeStyle = strongTrack;
    ctx.beginPath();
    ctx.arc(lx, ly, lr, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(lx, ly, lr * 0.52, t * 2.5, t * 2.5 + Math.PI * 1.35);
    ctx.stroke();

    const spokes = 8;
    for (let i = 0; i < spokes; i++) {
      const ang = (i / spokes) * Math.PI * 2 + t * 2.3;
      const pulse = 0.5 + 0.5 * Math.sin(t * 8 + i * 1.1);
      const rInner = lr * 0.26;
      const rOuter = lr * (0.68 + 0.32 * pulse);
      ctx.strokeStyle = i % 2 === 0 ? brightRed : boldGreen;
      ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 42, 42, 0.35)' : 'rgba(0, 255, 102, 0.25)';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(lx + Math.cos(ang - 0.14) * rInner, ly + Math.sin(ang - 0.14) * rInner);
      ctx.lineTo(lx + Math.cos(ang) * rOuter, ly + Math.sin(ang) * rOuter);
      ctx.lineTo(lx + Math.cos(ang + 0.14) * rInner, ly + Math.sin(ang + 0.14) * rInner);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    const lBoxX = 10 + Math.cos(t * 2.8) * 6;
    const lBoxY = h * 0.56 + Math.sin(t * 2.2) * 8;
    ctx.fillStyle = darkRedPanel;
    ctx.fillRect(lBoxX, lBoxY, 102, 82);
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = warnRed;
    ctx.strokeRect(lBoxX, lBoxY, 102, 82);
    drawWarningSign(ctx, lBoxX + 16, lBoxY + 18, 8, brightRed);
    ctx.fillStyle = brightRed;
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.fillText('WARN 0x9F', lBoxX + 28, lBoxY + 21);
    ctx.fillStyle = '#ff9999';
    ctx.fillText(`LAT ${Math.floor(8 + ((t * 64) % 58))}ms`, lBoxX + 7, lBoxY + 38);
    ctx.fillText(`CH-0${(Math.floor(t * 4) % 8) + 1}`, lBoxX + 7, lBoxY + 54);
    ctx.fillText(`HEX ${((Math.floor(t * 511) % 255).toString(16).toUpperCase().padStart(2, '0'))}F9`, lBoxX + 7, lBoxY + 70);

    const rx = Math.max(w - 82, w * 0.86) + Math.cos(t * 2.4) * 6;
    const ry = h * 0.34 + Math.sin(t * 3.1) * 10;
    const rr = Math.min(52, w * 0.11);
    ctx.lineWidth = 2;
    ctx.strokeStyle = strongTrack;
    ctx.beginPath();
    ctx.arc(rx, ry, rr, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = brightRed;
    ctx.beginPath();
    ctx.arc(rx, ry, rr + 4, -t * 3.2, -t * 3.2 + Math.PI * 0.85);
    ctx.stroke();

    const gaugeVal = Math.min(100, Math.floor(prankProgressValue));
    const sweepEnd = -Math.PI / 2 + (gaugeVal / 100) * Math.PI * 2;
    ctx.strokeStyle = warnRed;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(rx, ry, rr - 6, -Math.PI / 2, sweepEnd);
    ctx.stroke();

    ctx.lineWidth = 2;
    ctx.fillStyle = brightRed;
    ctx.font = 'bold 14px "Courier New", monospace';
    const gText = String(gaugeVal);
    ctx.fillText(gText, rx - ctx.measureText(gText).width / 2, ry + 5);

    const bx = Math.max(w - 110, w - 110) + Math.sin(t * 2.8) * 6;
    const by = h * 0.56 + Math.cos(t * 2.2) * 8;
    ctx.fillStyle = darkRedPanel;
    ctx.fillRect(bx, by, 100, 82);
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = warnRed;
    ctx.strokeRect(bx, by, 100, 82);
    drawWarningSign(ctx, bx + 50, by + 16, 7, warnFlash ? brightRed : warnRed);

    ctx.strokeStyle = brightRed;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let x = 6; x <= 94; x += 2.5) {
      const norm = x / 94;
      const env = Math.sin(norm * Math.PI);
      const amp = Math.sin(x * 0.28 + t * 15) * Math.cos(x * 0.12 - t * 8) * 18 * env;
      const py = by + 50 + amp;
      if (x === 6) ctx.moveTo(bx + x, py);
      else ctx.lineTo(bx + x, py);
    }
    ctx.stroke();

    ctx.lineWidth = 2;
    ctx.strokeStyle = strongTrack;
    ctx.beginPath();
    ctx.moveTo(lBoxX + 102, lBoxY + 41);
    ctx.lineTo(126, lBoxY + 41);
    ctx.lineTo(126, h - 18);
    ctx.lineTo(w - 126, h - 18);
    ctx.lineTo(w - 126, by + 41);
    ctx.lineTo(bx, by + 41);
    ctx.stroke();

    const pulseProg = (t * 0.95) % 1;
    const pulseX = 126 + pulseProg * Math.max(40, w - 252);
    ctx.fillStyle = brightRed;
    ctx.beginPath();
    ctx.arc(pulseX, h - 18, 4.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    if (onEleventhPage) {
      hudAnimId = requestAnimationFrame(drawSideHud);
    }
  }

  function startSideHud() {
    stopSideHud();
    hudAnimId = requestAnimationFrame(drawSideHud);
  }

  function stopSideHud() {
    if (hudAnimId) {
      cancelAnimationFrame(hudAnimId);
      hudAnimId = null;
    }
  }

  let matrixInterval = null;
  let hackerSweepPhase = 0;
  function startMatrix(){
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');
    function resize(){
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    const glyphs = ["#", "!", "X", "/", "\\", "_", "?", "%"];
    if (matrixInterval) clearInterval(matrixInterval);
    matrixInterval = setInterval(() => {
      hackerSweepPhase += 0.08;
      ctx.fillStyle = 'rgba(0, 4, 2, 0.24)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const gridSize = 28;
      ctx.strokeStyle = 'rgba(0, 255, 90, 0.08)';
      ctx.lineWidth = 1;
      for (let gx = 0; gx < canvas.width; gx += gridSize) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, canvas.height);
        ctx.stroke();
      }
      for (let gy = 0; gy < canvas.height; gy += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, gy);
        ctx.lineTo(canvas.width, gy);
        ctx.stroke();
      }

      const scanY = ((hackerSweepPhase * 90) % (canvas.height + 80)) - 40;
      const grad = ctx.createLinearGradient(0, scanY - 24, 0, scanY + 24);
      grad.addColorStop(0, 'rgba(0, 255, 80, 0)');
      grad.addColorStop(0.5, 'rgba(0, 255, 80, 0.22)');
      grad.addColorStop(1, 'rgba(0, 255, 80, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, scanY - 24, canvas.width, 48);

      ctx.font = 'bold 13px monospace';
      for (let k = 0; k < 14; k++) {
        const rx = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize + 8;
        const ry = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize + 18;
        const sym = glyphs[Math.floor(Math.random() * glyphs.length)];
        ctx.fillStyle = Math.random() > 0.72 ? 'rgba(255, 45, 45, 0.55)' : 'rgba(0, 255, 100, 0.36)';
        ctx.fillText(sym, rx, ry);
      }
    }, 55);
  }

  function stopMatrix(){
    if (matrixInterval) {
      clearInterval(matrixInterval);
      matrixInterval = null;
    }
    canvas.style.display = 'none';
  }

  function clearStepTimers(){
    if (stepInterval) { clearInterval(stepInterval); stepInterval = null; }
    if (stepTimeout) { clearTimeout(stepTimeout); stepTimeout = null; }
  }

  function showFriendlyPage(index){
    clearStepTimers();
    currentIndex = index;
    const item = friendlyPages[index];

    startStepHackerBg();
    stage.style.setProperty('--step-glow', item.glow);
    friendlyPage.style.setProperty('--theme', item.color);
    friendlyPage.style.setProperty('--tint', item.tint);
    pageTitle.textContent = item.title;
    pageBar.style.width = '0%';
    pageTimer.textContent = '1s';

    friendlyPage.classList.remove('show');
    void friendlyPage.offsetWidth;
    friendlyPage.classList.add('show');

    const startTime = Date.now();
    stepInterval = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const pct = Math.min(100, (elapsed / STEP_DURATION_MS) * 100);
      const leftSec = Math.max(0, Math.ceil((STEP_DURATION_MS - elapsed) / 1000));
      pageBar.style.width = pct + '%';
      pageTimer.textContent = `${leftSec}s`;
    }, 40);

    stepTimeout = setTimeout(() => {
      clearStepTimers();
      if (index < friendlyPages.length - 1) {
        showFriendlyPage(index + 1);
      } else {
        openEleventhOriginalPrank();
      }
    }, STEP_DURATION_MS);
  }

  const lines = [
    { text: "> connecting to device...", bad:false },
    { text: "> access granted", bad:false },
    { text: "> scanning system...", bad:false },
    { text: "> unauthorized access detected", bad:true },
    { text: "> running deep scan...", bad:true },
    { text: "> system compromised", bad:true },
    { text: "> Whatsappp Access Granted", bad:false },
    { text: "> Whatsapp OTP Crashing", bad:false },
    { text: "> Whatsapp Chat Transfering", bad:true },
    { text: "> Browser Watch History", bad:true },
  ];

  function addLine(i){
    if (i >= lines.length) return;
    const d = document.createElement('div');
    d.textContent = lines[i].text;
    if (lines[i].bad) d.classList.add('bad');
    logEl.appendChild(d);
    requestAnimationFrame(()=> d.classList.add('on'));
  }

  function openEleventhOriginalPrank(){
    clearStepTimers();
    stopStepHackerBg();
    onEleventhPage = true;
    prankProgressValue = 0;
    armBackLock(BACK_LOCK_MS, BACK_GUARD_DEPTH);
    buildReversedBuffer('Glitchinng.aac').catch(() => {});
    buildReversedBuffer('Gotcha.aac').catch(() => {});

    friendlyPage.classList.remove('show');
    prank.style.display = 'flex';
    prank.classList.add('redFlickerActive');
    startMatrix();
    startSideHud();

    picWrap.classList.remove('show');
    logEl.innerHTML = '';
    barInner.style.width = '0%';
    pctEl.textContent = '0%';

    gotchaSound.currentTime = 0;
    gotchaSound.play().catch(() => {});

    setTimeout(()=> picWrap.classList.add('show'), 150);

    const lineDelay = 500;
    lines.forEach((l, i) => {
      setTimeout(()=> addLine(i), 450 + i*lineDelay);
    });

    let pct = 0;
    const totalDuration = 14000;
    const stepTime = 40;
    const steps = totalDuration / stepTime;
    const increment = 100 / steps;
    const barTimer = setInterval(()=>{
      pct = Math.min(100, pct + increment);
      prankProgressValue = pct;
      barInner.style.width = pct + '%';
      pctEl.textContent = Math.floor(pct) + '%';
      if (pct >= 100){
        clearInterval(barTimer);
      }
    }, stepTime);

    setTimeout(()=>{
      stage.classList.add('flash');
    }, totalDuration + 700);

    setTimeout(()=>{
      stage.classList.remove('flash');
      prank.classList.remove('redFlickerActive');
      stopSideHud();
      prank.style.display = 'none';
      thanksHackerScreen.classList.add('show');
      gotchaSound.pause();
      revealSound.currentTime = 0;
      revealSound.play().catch(() => {});
    }, totalDuration + 1100);

    setTimeout(()=>{
      onEleventhPage = false;
      prank.classList.remove('redFlickerActive');
      stopSideHud();
      thanksHackerScreen.classList.remove('show');
      stopMatrix();
      revealSound.pause();
      finalBlack.classList.add('show');
    }, totalDuration + 1100 + 10000);
  }

  startBtn.addEventListener('click', function(){
    if (isBlockedSecondVisit || hasOpenedBefore()) {
      lockOutSecondVisit();
      return;
    }
    markAsOpened();
    getAudioContext();
    armBackLock(BACK_LOCK_MS, BACK_GUARD_DEPTH);
    startScreen.style.display = 'none';
    showFriendlyPage(0);
  });

  startMatrix();
  if (hasOpenedBefore()) {
    lockOutSecondVisit();
    startMatrix();
  } else {
    markAsOpened();
    armBackLock(BACK_LOCK_MS, BACK_GUARD_DEPTH);
    startMatrix();
  }
})();
</script>
